<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cravings — NayiSaans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/app.css">
<script src="assets/js/api.js"></script>
<script src="assets/js/nav.js"></script>
</head>
<body>

<div class="app-bar">
  <div class="wrap app-bar-inner">
    <a href="dashboard.html" class="logo"><span class="logo-mark"></span>NayiSaans</a>
    <div class="app-bar-right">
      <div class="user-chip"><div class="user-avatar" id="userInitial">U</div><span id="userName">Loading...</span></div>
    </div>
  </div>
</div>
<div id="appNavMount"></div>

<div class="page-shell narrow">
  <div class="page-head">
    <div class="eyebrow">Not monitoring — understanding</div>
    <h1>Log a craving</h1>
    <p>Record it as it happens. This helps identify recurring patterns, not to make you feel watched.</p>
  </div>

  <div class="card">
    <div class="field">
      <label for="intensitySlider">Craving intensity</label>
      <input type="range" id="intensitySlider" min="1" max="10" value="5" oninput="document.getElementById('intensityVal').textContent=this.value">
      <div style="text-align:center;font-weight:700;color:var(--blue-deep);margin-top:6px;" id="intensityVal">5</div>
    </div>

    <div class="field">
      <label for="triggerSelect">Trigger</label>
      <select id="triggerSelect">
        <option value="">Select a trigger</option>
        <option>Stress</option><option>Coffee or meals</option><option>Alcohol</option>
        <option>Certain locations</option><option>Social situations</option><option>Boredom</option>
        <option>Fatigue</option><option>Conflict</option><option>Work breaks</option>
        <option>Driving</option><option>Evening routines</option>
      </select>
    </div>

    <div class="field">
      <label>Emotion</label>
      <div class="chip-row" id="emotionChips">
        <div class="chip" data-value="anxious">Anxious</div>
        <div class="chip" data-value="frustrated">Frustrated</div>
        <div class="chip" data-value="bored">Bored</div>
        <div class="chip" data-value="lonely">Lonely</div>
        <div class="chip" data-value="content">Content</div>
        <div class="chip" data-value="tired">Tired</div>
      </div>
    </div>

    <div class="field">
      <label for="contextSelect">Context</label>
      <select id="contextSelect">
        <option value="">Select context</option>
        <option>After a meal</option><option>At home</option><option>During work</option>
        <option>While socialising</option><option>When feeling stressed</option>
        <option>During an evening routine</option><option>Around other smokers</option>
      </select>
    </div>

    <div class="field">
      <label for="cravingNote">Notes (optional)</label>
      <textarea id="cravingNote" placeholder="Anything else worth remembering..."></textarea>
    </div>

    <button class="btn-primary-block" id="submitBtn" onclick="submitCraving()">Save craving</button>
  </div>

  <div class="card">
    <div class="panel-head"><h3>Recent cravings</h3></div>
    <div class="entry-list" id="cravingList"><!-- injected --></div>
  </div>
</div>

<script>
  document.getElementById('emotionChips').addEventListener('click', e => {
    if (e.target.classList.contains('chip')) {
      document.querySelectorAll('#emotionChips .chip').forEach(c => c.classList.remove('selected'));
      e.target.classList.add('selected');
    }
  });

  async function submitCraving(){
    const intensity = Number(document.getElementById('intensitySlider').value);
    const trigger = document.getElementById('triggerSelect').value || null;
    const emotionEl = document.querySelector('#emotionChips .chip.selected');
    const emotion = emotionEl ? emotionEl.dataset.value : null;
    const context = document.getElementById('contextSelect').value || null;
    const note = document.getElementById('cravingNote').value.trim() || null;

    const btn = document.getElementById('submitBtn');
    btn.textContent = 'Saving...'; btn.disabled = true;
    try {
      await logCraving({ intensity, trigger, emotion, context, note });
      document.getElementById('cravingNote').value = '';
      document.querySelectorAll('#emotionChips .chip.selected').forEach(c => c.classList.remove('selected'));
      document.getElementById('triggerSelect').value = '';
      document.getElementById('contextSelect').value = '';
      document.getElementById('intensitySlider').value = 5;
      document.getElementById('intensityVal').textContent = 5;
      loadCravings();
    } catch (err) {
      alert(err.message || 'Could not save this craving.');
    } finally {
      btn.textContent = 'Save craving'; btn.disabled = false;
    }
  }

  async function loadCravings(){
    try {
      const { entries } = await getCravings();
      const el = document.getElementById('cravingList');
      if (!entries.length){ el.innerHTML = '<p class="empty-note">No cravings logged yet.</p>'; return; }
      el.innerHTML = entries.map(e => `
        <div class="entry-row">
          <div class="entry-row-head">
            <span style="font-weight:700;font-size:13.5px;">Intensity ${e.intensity}/10</span>
            <span class="entry-time">${new Date(e.timestamp).toLocaleString()}</span>
          </div>
          ${e.note ? `<p>${e.note}</p>` : ''}
          <div class="entry-tags">
            ${e.trigger ? `<span class="pill">${e.trigger}</span>` : ''}
            ${e.emotion ? `<span class="pill pill-amber">${e.emotion}</span>` : ''}
            ${e.context ? `<span class="pill pill-teal">${e.context}</span>` : ''}
          </div>
        </div>
      `).join('');
    } catch (err) { /* ok if empty */ }
  }

  (async function init(){
    renderAppNav('cravings');
    if (typeof isLoggedIn !== 'function' || !isLoggedIn()) { window.location.href = 'login.html'; return; }
    try {
      const { user } = await getCurrentUser();
      document.getElementById('userName').textContent = user.full_name || user.email;
      document.getElementById('userInitial').textContent = (user.full_name || user.email).charAt(0).toUpperCase();
    } catch (e) { window.location.href = 'login.html'; return; }
    loadCravings();
  })();
</script>

</body>
</html>
